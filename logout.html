<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Logout - FaceTrack</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen flex items-center justify-center bg-slate-100 p-4">
<div class="w-full max-w-md rounded-2xl bg-white p-10 text-center shadow-lg">
<div class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-red-100 text-4xl">🚪</div>
<h1 class="mb-3 text-3xl font-bold text-slate-800">Logout</h1>
<p class="mb-8 text-slate-500">Are you sure you want to logout from FaceTrack Attendance System?</p>
<button onclick="logout()" class="mb-4 w-full rounded-lg bg-red-500 py-3 font-semibold text-white hover:bg-red-600">Yes, Logout</button>
<button onclick="goBack()" class="w-full rounded-lg bg-slate-200 py-3 font-semibold text-slate-700 hover:bg-slate-300">Cancel</button>
<p class="mt-6 text-sm text-slate-400">FaceTrack Attendance System</p></div>
<script>function logout(){sessionStorage.removeItem('ftRole');sessionStorage.removeItem('ftStudentId');sessionStorage.removeItem('ftUserName');window.location.replace('login.html');}function goBack(){window.location.replace('index.html');}</script>
</body></html>
